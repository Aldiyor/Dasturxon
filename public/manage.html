<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Dasturxon — Bronni boshqarish</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Inter',sans-serif;background:#f5f3ef;min-height:100vh;color:#1a1a18}
    .header{background:#1c3d2e;padding:16px 24px;display:flex;align-items:center;justify-content:space-between}
    .logo{color:#e8f0eb;font-size:18px;font-weight:500;letter-spacing:0.04em;text-decoration:none}
    .logo span{font-size:11px;color:rgba(255,255,255,0.35);display:block;margin-top:2px;letter-spacing:0.1em}
    .lang-switch{display:flex;gap:4px}
    .lang-btn{background:rgba(255,255,255,0.1);border:0.5px solid rgba(255,255,255,0.2);color:rgba(255,255,255,0.6);border-radius:6px;padding:5px 10px;font-size:12px;cursor:pointer;font-family:'Inter',sans-serif}
    .lang-btn.active{background:rgba(255,255,255,0.2);color:#fff}
    .container{max-width:480px;margin:36px auto;padding:0 16px 48px}
    .card{background:#fff;border:0.5px solid #e5e0d8;border-radius:14px;padding:24px;margin-bottom:16px}
    h2{font-size:19px;font-weight:600;margin-bottom:4px}
    .sub{font-size:13px;color:#6b6660;margin-bottom:20px}
    label{display:block;font-size:11px;font-weight:500;color:#6b6660;text-transform:uppercase;letter-spacing:0.07em;margin-bottom:6px}
    input{width:100%;border:0.5px solid #e5e0d8;border-radius:8px;padding:11px 14px;font-size:14px;font-family:'Inter',sans-serif;color:#1a1a18;outline:none}
    input:focus{border-color:#1c3d2e}
    .btn{display:block;width:100%;border:none;border-radius:8px;padding:12px;font-size:14px;font-weight:500;cursor:pointer;font-family:'Inter',sans-serif;margin-top:10px;text-align:center}
    .btn-primary{background:#1c3d2e;color:#fff}
    .btn-primary:hover{opacity:0.87}
    .btn-danger{background:#8b2e2e;color:#fff}
    .btn-secondary{background:transparent;color:#6b6660;border:0.5px solid #e5e0d8}
    .detail{display:flex;justify-content:space-between;padding:9px 0;border-bottom:0.5px solid #e5e0d8;font-size:14px}
    .detail:last-child{border-bottom:none}
    .detail-key{color:#6b6660}
    .detail-val{font-weight:500}
    .ref-box{font-family:monospace;font-size:18px;letter-spacing:0.18em;color:#7a5c2e;background:#f0ece4;padding:10px 20px;border-radius:8px;text-align:center;margin-bottom:16px}
    .alert{padding:13px 16px;border-radius:10px;font-size:14px;line-height:1.5;margin-top:12px}
    .alert-success{background:#eaf3de;color:#3b6d11;border:0.5px solid #c0dd97}
    .alert-error{background:#fdecea;color:#8b2e2e;border:0.5px solid #f5c0bc}
    .alert-info{background:#f5f3ef;color:#6b6660;border:0.5px solid #e5e0d8}
    .hidden{display:none}
    .status-confirmed{color:#3b6d11;font-weight:500}
    .status-cancelled{color:#8b2e2e;font-weight:500}
  </style>
</head>
<body>

<div class="header">
  <a href="/" class="logo">Dasturxon <span id="hdr-sub">Bronni boshqarish</span></a>
  <div class="lang-switch">
    <button class="lang-btn active" onclick="setLang('uz')">UZ</button>
    <button class="lang-btn" onclick="setLang('ru')">RU</button>
    <button class="lang-btn" onclick="setLang('en')">EN</button>
  </div>
</div>

<div class="container">

  <!-- Lookup -->
  <div class="card" id="card-lookup">
    <h2 id="t-title">Bronni boshqarish</h2>
    <div class="sub" id="t-sub">Bron kodingizni kiriting</div>
    <div style="margin-bottom:14px">
      <label id="t-lbl-ref">Bron kodi</label>
      <input type="text" id="ref-input" placeholder="BN-XXXXX" style="text-transform:uppercase;letter-spacing:0.1em"/>
    </div>
    <button class="btn btn-primary" onclick="lookup()" id="t-btn-search">Qidirish</button>
    <div id="lookup-msg"></div>
  </div>

  <!-- Details -->
  <div class="card hidden" id="card-details">
    <h2 id="t-details-title">Bron ma'lumotlari</h2>
    <div class="sub" id="booking-status"></div>
    <div class="ref-box" id="detail-ref"></div>
    <div id="detail-rows"></div>
    <button class="btn btn-danger" onclick="showConfirm()" id="t-btn-cancel" style="margin-top:18px">Bronni bekor qilish</button>
    <button class="btn btn-secondary" onclick="reset()" id="t-btn-back">Orqaga</button>
  </div>

  <!-- Cancel confirm -->
  <div class="card hidden" id="card-confirm">
    <h2 style="color:#8b2e2e" id="t-confirm-title">Bekor qilishni tasdiqlang</h2>
    <div class="sub" id="t-confirm-sub">Bu amalni qaytarib bo'lmaydi.</div>
    <button class="btn btn-danger" onclick="doCancel()" id="t-btn-yes">Ha, bekor qilish</button>
    <button class="btn btn-secondary" onclick="hideConfirm()" id="t-btn-no">Yo'q, qaytish</button>
    <div id="cancel-msg"></div>
  </div>

  <!-- Done -->
  <div class="card hidden" id="card-done">
    <div style="text-align:center;padding:24px 0">
      <div style="font-size:40px;margin-bottom:12px">✓</div>
      <h2 id="t-done-title" style="margin-bottom:8px">Bekor qilindi</h2>
      <div class="sub" id="t-done-sub">Broningiz muvaffaqiyatli bekor qilindi.</div>
    </div>
  </div>

</div>

<script>
const T = {
  uz: {
    hdrSub:'Bronni boshqarish', title:'Bronni boshqarish', sub:'Bron kodingizni kiriting',
    lblRef:'Bron kodi', btnSearch:'Qidirish', detailsTitle:"Bron ma'lumotlari",
    confirmed:'Tasdiqlangan', cancelled:'Bekor qilingan',
    keys:['Restoran','Sana','Vaqt','Mehmonlar','Ism'],
    btnCancel:'Bronni bekor qilish', btnBack:'Orqaga',
    confirmTitle:'Bekor qilishni tasdiqlang', confirmSub:"Bu amalni qaytarib bo'lmaydi.",
    btnYes:'Ha, bekor qilish', btnNo:"Yo'q, qaytish",
    doneTitle:'Bekor qilindi', doneSub:'Broningiz muvaffaqiyatli bekor qilindi.',
    searching:'Qidirilmoqda...', notFound:'Bron topilmadi. Kodni tekshiring.',
    cancelling:'Bekor qilinmoqda...', cancelErr:'Xatolik yuz berdi. Qayta urining.',
    alreadyCancelled:'Bu bron allaqachon bekor qilingan.',
    fetchErr:'Xatolik yuz berdi.',
  },
  ru: {
    hdrSub:'Управление бронью', title:'Управление бронью', sub:'Введите код бронирования',
    lblRef:'Код бронирования', btnSearch:'Найти', detailsTitle:'Детали бронирования',
    confirmed:'Подтверждено', cancelled:'Отменено',
    keys:['Ресторан','Дата','Время','Гостей','Имя'],
    btnCancel:'Отменить бронь', btnBack:'Назад',
    confirmTitle:'Подтвердите отмену', confirmSub:'Это действие нельзя отменить.',
    btnYes:'Да, отменить', btnNo:'Нет, назад',
    doneTitle:'Бронь отменена', doneSub:'Ваша бронь успешно отменена.',
    searching:'Поиск...', notFound:'Бронирование не найдено. Проверьте код.',
    cancelling:'Отменяем...', cancelErr:'Произошла ошибка. Попробуйте ещё раз.',
    alreadyCancelled:'Это бронирование уже отменено.',
    fetchErr:'Произошла ошибка.',
  },
  en: {
    hdrSub:'Manage reservation', title:'Manage reservation', sub:'Enter your booking reference',
    lblRef:'Booking reference', btnSearch:'Search', detailsTitle:'Booking details',
    confirmed:'Confirmed', cancelled:'Cancelled',
    keys:['Restaurant','Date','Time','Guests','Name'],
    btnCancel:'Cancel reservation', btnBack:'Back',
    confirmTitle:'Confirm cancellation', confirmSub:'This action cannot be undone.',
    btnYes:'Yes, cancel', btnNo:'No, go back',
    doneTitle:'Reservation cancelled', doneSub:'Your reservation has been successfully cancelled.',
    searching:'Searching...', notFound:'Booking not found. Check the reference code.',
    cancelling:'Cancelling...', cancelErr:'Something went wrong. Please try again.',
    alreadyCancelled:'This reservation has already been cancelled.',
    fetchErr:'Something went wrong.',
  },
};

let lang = 'uz';
let currentBooking = null;

function setLang(l) {
  lang = l;
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
  document.querySelector(`.lang-btn[onclick="setLang('${l}')"]`).classList.add('active');
  applyLang();
}

function applyLang() {
  const t = T[lang];
  document.getElementById('hdr-sub').textContent = t.hdrSub;
  document.getElementById('t-title').textContent = t.title;
  document.getElementById('t-sub').textContent = t.sub;
  document.getElementById('t-lbl-ref').textContent = t.lblRef;
  document.getElementById('t-btn-search').textContent = t.btnSearch;
  document.getElementById('t-details-title').textContent = t.detailsTitle;
  document.getElementById('t-btn-cancel').textContent = t.btnCancel;
  document.getElementById('t-btn-back').textContent = t.btnBack;
  document.getElementById('t-confirm-title').textContent = t.confirmTitle;
  document.getElementById('t-confirm-sub').textContent = t.confirmSub;
  document.getElementById('t-btn-yes').textContent = t.btnYes;
  document.getElementById('t-btn-no').textContent = t.btnNo;
  document.getElementById('t-done-title').textContent = t.doneTitle;
  document.getElementById('t-done-sub').textContent = t.doneSub;
  if (currentBooking) renderDetails(currentBooking);
}

function show(id) {
  ['card-lookup','card-details','card-confirm','card-done']
    .forEach(c => document.getElementById(c).classList.add('hidden'));
  document.getElementById(id).classList.remove('hidden');
}

function msg(elId, text, type) {
  const el = document.getElementById(elId);
  el.innerHTML = `<div class="alert alert-${type}">${text}</div>`;
}

async function lookup() {
  const ref = document.getElementById('ref-input').value.trim().toUpperCase();
  if (!ref) return;
  document.getElementById('lookup-msg').innerHTML = `<div class="alert alert-info">${T[lang].searching}</div>`;
  try {
    const res = await fetch(`https://dasturxon-rho.vercel.app/api/reservation/${ref}`);
    const data = await res.json();
    if (!res.ok || !data.reservation) {
      msg('lookup-msg', T[lang].notFound, 'error');
      return;
    }
    currentBooking = data.reservation;
    renderDetails(currentBooking);
    show('card-details');
  } catch(e) {
    msg('lookup-msg', T[lang].fetchErr, 'error');
  }
}

function renderDetails(b) {
  const t = T[lang];
  const statusEl = document.getElementById('booking-status');
  statusEl.innerHTML = b.status === 'confirmed'
    ? `<span class="status-confirmed">✓ ${t.confirmed}</span>`
    : `<span class="status-cancelled">✗ ${t.cancelled}</span>`;
  document.getElementById('detail-ref').textContent = b.ref;
  const vals = [b.restaurant_slug, b.date, b.time, b.party, b.guest_name];
  document.getElementById('detail-rows').innerHTML = t.keys.map((k,i) =>
    `<div class="detail"><span class="detail-key">${k}</span><span class="detail-val">${vals[i]||'—'}</span></div>`
  ).join('');
  document.getElementById('t-btn-cancel').style.display =
    b.status === 'cancelled' ? 'none' : 'block';
}

function showConfirm() { show('card-confirm'); }
function hideConfirm() { show('card-details'); }

async function doCancel() {
  const ref = currentBooking.ref;
  document.getElementById('cancel-msg').innerHTML = `<div class="alert alert-info">${T[lang].cancelling}</div>`;
  try {
    const res = await fetch('https://dasturxon-rho.vercel.app/api/cancel', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ ref }),
    });
    const data = await res.json();
    if (data.success) {
      show('card-done');
    } else {
      msg('cancel-msg', data.error || T[lang].cancelErr, 'error');
    }
  } catch(e) {
    msg('cancel-msg', T[lang].fetchErr, 'error');
  }
}

function reset() {
  currentBooking = null;
  document.getElementById('ref-input').value = '';
  document.getElementById('lookup-msg').innerHTML = '';
  show('card-lookup');
}

// Auto-load from URL
const params = new URLSearchParams(window.location.search);
const refParam = params.get('ref');
const langParam = params.get('lang');
if (langParam && T[langParam]) setLang(langParam);
if (refParam) {
  document.getElementById('ref-input').value = refParam.toUpperCase();
  lookup();
}
</script>
</body>
</html>
